# Approved upstream capability sources.
# Cloning a source is NOT installing it. Checkout content is untrusted until a reviewer
# curates specific assets into registry/capabilities/<id>/ with a capability.yaml manifest.
version: 1
sources:
  - id: rea
    name: REA (Reverse Engineer Anything)
    url: https://github.com/morluto/rea
    license: MIT
    default_branch: main
    trust: untrusted
    homepage: https://github.com/morluto/rea
    notes:
      - "Node.js npm package (rea-agents): one binary that is both a CLI and a stdio MCP server."
      - "Only end-user skill: .agents/skills/reverse-engineer-anything (needs the REA MCP/CLI runtime)."
      - "install.sh does `npm install --global` and `rea setup` writes ~/.claude.json and ~/.claude/skills: never run by Agent Forge."
      - "Third-party notices: THIRD_PARTY_NOTICES.md, licenses/, DISCLAIMER.md (usage restrictions)."
    redistribution_notes: "MIT; keep LICENSE notice and DISCLAIMER.md usage rules when republishing skill text."

  - id: ecc
    name: Everything Claude Code (ECC)
    url: https://github.com/affaan-m/ECC
    license: MIT
    default_branch: main
    trust: untrusted
    homepage: https://github.com/affaan-m/ECC
    notes:
      - "Claude Code plugin + cross-platform content pack: 311 skills, 71 agents, 97 commands, rules/, hooks/."
      - "Hooks are inline `node -e` bootstraps that write session state under ~/.claude; never installed by Agent Forge."
      - "Exceptions to MIT: skills/osint-investigation (CC-BY-SA-4.0); 8 supply-chain skills (Apache-2.0); react-performance adapted from vercel-labs (MIT, attributed)."
      - "scripts/sync-ecc-to-codex.sh sets git config --global core.hooksPath: never run."
    redistribution_notes: "MIT for curated assets; check per-skill `license:` frontmatter before curating."

  - id: ui-ux-pro-max
    name: UI UX Pro Max
    url: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
    license: MIT
    default_branch: main
    trust: untrusted
    homepage: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill
    notes:
      - "Claude Code plugin (7 skills) + npm CLI installer (uipro) + skill.json manifest for 19 platforms."
      - "Core skill depends on stdlib-only Python scripts (search.py over CSV design data); markdown guidance works without them."
      - "Sub-skills design/, design-system/, ui-styling/ call external APIs or subprocess: not curated."
      - ".claude/skills/ui-styling/LICENSE.txt is Apache-2.0; canvas fonts are SIL OFL."
    redistribution_notes: "MIT for the core skill; Apache-2.0 for ui-styling; keep per-font OFL notices if ever curated."

  - id: karpathy
    name: Andrej Karpathy-inspired coding guidelines
    url: https://github.com/multica-ai/andrej-karpathy-skills
    license: MIT
    default_branch: main
    trust: untrusted
    homepage: https://github.com/multica-ai/andrej-karpathy-skills
    notes:
      - "Four behavioral principles (think before coding, simplicity first, surgical changes, goal-driven execution) shipped three ways: CLAUDE.md, a Claude Code plugin skill, a Cursor rule."
      - "Pure markdown: no scripts, hooks, MCP servers or network use."
      - "Repository was previously forrestchang/andrej-karpathy-skills; README install snippets still point there."
    redistribution_notes: "No LICENSE file in the repository; MIT is declared in README.md and in the SKILL.md `license:` frontmatter. Keep attribution to the author (forrestchang)."

  - id: mattpocock
    name: Matt Pocock's Skills For Real Engineers
    url: https://github.com/mattpocock/skills
    license: MIT
    default_branch: main
    pinned_revision: 24fe0ef7737efae15c87225755e9f6f5965e4888  # tag v1.3.1
    trust: untrusted
    homepage: https://github.com/mattpocock/skills
    notes:
      - "Pure-markdown Agent Skills (27 promoted in skills/engineering + skills/productivity); the Claude Code plugin manifest declares skills only (no hooks, no MCP)."
      - "Cross-skill calls are written as `Call the Skill tool with \"X\"`; user-invoked skills set disable-model-invocation and agents/openai.yaml policy.allow_implicit_invocation: false."
      - "setup-matt-pocock-skills writes an `## Agent skills` block into CLAUDE.md/AGENTS.md outside markers and runs `gh label create`; to-spec/to-tickets/triage/wayfinder/implement* depend on it: not curated."
      - "scripts/link-skills.sh symlinks into ~/.claude/skills and ~/.agents/skills: never run."
      - "Pinned to release tags; main carries unreleased changesets."
    redistribution_notes: "MIT (c) 2026 Matt Pocock; keep LICENSE. skills/engineering/pr is adapted from humanlayer `show-me` (see pr/CREDITS.md); upstream licence unverified, not curated."
