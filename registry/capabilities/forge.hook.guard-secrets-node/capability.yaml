schema_version: "1"
id: forge.hook.guard-secrets-node
name: Guard secret files (Node hook)
description: PreToolUse hook that blocks Edit/Write on .env, key, certificate and credential files; implemented in dependency-free Node for JavaScript/TypeScript projects.
version: 1.0.0
kind: hook
category: safety.hooks
purpose: Stops the agent from editing credential stores by mistake. Exit code 2 blocks the tool call and explains why; the file is never read.
status: curated
provenance: workspace
source:
  source_id: workspace
license:
  spdx: MIT
  attribution: "Agent Forge maintainers"
  redistribution_ok: true
review:
  reviewed_at: "2026-10-16"
  reviewer: agent-forge maintainers
  rationale: Same logic as the Python guard, for projects where `node` is guaranteed. No dependencies, no network, no writes. Merged into .claude/settings.json; requires `approve --hooks`.
  risk_rationale: "Runs a command on every Edit/Write. Limited to reading the hook payload (never the file), no network, no writes, fails open; gated by approve --hooks."
  notes:
    - "Sees only the Edit / Write / MultiEdit payload: a file written through the Bash tool (tee, >, sed -i, cp) bypasses it. Pair with forge.hook.guard-secret-literals for values and a repository-level scanner in CI."
applicability:
  languages: [javascript, typescript]
  tags: [security, hooks, guard]
platforms: [claude_code]
install_strategy: file_copy
destinations:
  - platform: claude_code
    source: claude_code/scripts
    dest: .claude/hooks/agent-forge
    merge: create_only
  - platform: claude_code
    source: claude_code/hooks.json
    dest: .claude/settings.json
    merge: json_merge
    section_id: forge-guard-secrets
conflicts: [forge.hook.guard-secrets-python]
removal: delete_managed_files
risk: medium
benefit_score: 6
maintenance_cost: 1
integrity:
  assets_sha256: c5462633a5693d6197a7d43ec5453d57f729f92bd5fe8dd19d8b05d499ed5599
  pinned_at: "2026-10-16"
