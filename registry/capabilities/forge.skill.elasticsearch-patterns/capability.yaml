schema_version: "1"
id: forge.skill.elasticsearch-patterns
name: Elasticsearch patterns (an index you can rebuild, a query that cannot take the cluster down)
description: Checklist for any code that touches an Elasticsearch or OpenSearch index in any client - the index derived from a primary store and rebuildable, explicit mappings in versioned templates behind an alias with keyword vs text chosen per field, filter context and the tenant filter in every query, point-in-time with search_after for deep pages and exports instead of from/size, bounded sizes and track_total_hits, bulk indexing by bytes with per-item error handling and backoff on 429, a refresh policy chosen on purpose, timeouts plus bulkhead and circuit breaker so an overloaded cluster degrades the feature and not the service, slowlog and shard sizing checked before go-live.
version: 1.0.0
kind: skill
category: engineering.data
purpose: Prevents the Elasticsearch failures that only appear under production data and load - a mapping guessed from the first document, a deep page refused or slow on every shard, a bulk indexer that cascades 429s, a dual write that leaves the index and the database disagreeing, a search without a timeout that holds threads while the cluster is red - by making the agent apply the same discipline whatever the client.
