review:
  reviewed_at: "2026-10-23"
  reviewer: agent-forge maintainers
  rationale: >-
    Workspace-authored after a field test on a JVM / Node platform (Elasticsearch 8) whose search
    layer had no curated counterpart and whose scanner missed the client dependency altogether.
    Client-neutral rules; the knob names are the server's (`search_after`, `pit`, `refresh`,
    `track_total_hits`), not a product's. No product identifiers, index names or module layouts.
    Gated by the `elasticsearch` integration the scanner records from a manifest dependency (the
    Java API client, Spring Data Elasticsearch, the REST client, @elastic/elasticsearch, the
    Python and Go clients, their OpenSearch forks); on-demand, 0 always-loaded beyond name +
    description.
  notes:
    - "Companion to forge.skill.event-contract / event-consumer-safety (the indexer is a consumer of the primary store's changes) and forge.skill.tenant-isolation (tenant filter in every query); loaded only when their traits are detected."
    - "Evidence: not measured by the harness (review.evidence empty on purpose)."
