review:
  reviewed_at: '2026-10-21'
  reviewer: agent-forge curation (automated session; human sign-off pending)
  rationale: Upstream rules/react-native/ minus hooks.md (it documents ECC's own hooks in ~/.claude/settings.json). Every file has `paths:` frontmatter, so context_chars is 0 (ADR-0003), which is why the per-language packs deferred in docs/rejections/ecc-rules-per-language.md are curated now. Installed under .claude/rules/ecc-react-native/ next to ecc-common/. Applies to frameworks react-native; no hard dependency on ecc.rules.common, the text stands on its own.
  notes:
  - 'Adapted: the ''> This file extends [common/x.md](../common/x.md)'' line in each file is rewritten to name ecc.rules.common instead of a relative link that would be broken once installed.'
