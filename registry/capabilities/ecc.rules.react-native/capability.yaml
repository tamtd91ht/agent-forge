schema_version: '1'
id: ecc.rules.react-native
name: React Native rules (path-scoped)
description: 'Path-scoped Claude Code rules for React Native: coding-style, patterns, security, testing, accessibility, performance, production-readiness. Each file carries `paths:` frontmatter, so it loads only when a matching file is in play and adds no always-loaded context.'
version: 1.0.0
kind: rule
category: engineering.standards
purpose: 'Gives a React Native project the stack-specific half of ECC''s rules without paying for it in every session: 16,976 characters of guidance that the tool attaches only to matching files.'
status: curated
provenance: adapted
source:
  source_id: ecc
  repository: https://github.com/affaan-m/ECC
  revision: 76aaa77df6adc5b889e689007bf99b9a4f74af34
  paths:
