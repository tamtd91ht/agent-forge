id: mattpocock.diagnosing-bugs
name: Diagnosing bugs (feedback-loop first)
description: Disciplined diagnosis loop for hard bugs and performance regressions - build a red-capable feedback loop, minimise, rank falsifiable hypotheses, instrument, fix with a regression test, clean up.
version: 1.0.0
kind: skill
category: engineering.debugging
purpose: Stops the agent from jumping to a theory by reading code - Phase 1 is only complete when one command it has already run goes red on the user's exact symptom, deterministically and fast. Tagged debug logs and a cleanup checklist keep the fix tidy.
