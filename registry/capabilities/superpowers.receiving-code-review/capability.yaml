schema_version: "1"
id: superpowers.receiving-code-review
name: Receiving code review
description: Handle review feedback with technical rigour - restate, verify each item against the codebase, push back with reasons or YAGNI checks, clarify unclear items before implementing any, then fix one at a time.
version: 1.0.0
kind: skill
category: engineering.review
purpose: Covers the receiving side of review, which the registry otherwise lacks - no performative agreement, no blind implementation of suggestions that break the codebase or add unused features, partner instructions trusted but external reviewers checked, inline GitHub comments answered in their thread.
