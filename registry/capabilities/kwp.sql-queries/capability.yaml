description: Write correct, performant analytical SQL for PostgreSQL, Snowflake, BigQuery, Redshift and Databricks - dialect-specific date, string, JSON and array syntax, window functions, CTEs, cohort retention, funnels, deduplication and debugging of slow or wrong queries.
