schema_version: "1"
id: superpowers.verification-before-completion
name: Verification before completion
description: Gate every "done", "fixed" or "passing" claim on a verification command run in the same turn, with the evidence quoted - no claims from earlier runs, partial checks or sub-agent reports.
version: 1.0.0
kind: skill
category: engineering.verification
purpose: Stops unverified success claims - the agent names the command that proves the claim, runs it fresh, reads the output and only then reports, including for regression tests (red-green) and delegated work (check the diff, not the report). Complements ecc.verification-loop, which runs the checks; this skill governs what may be claimed from them.
