schema_version: "1"
id: forge.skill.agent-forge-upgrade
name: Agent Forge upgrade skill
description: The project's entry point to Agent Forge - user-invoked /agent-forge-upgrade has the coding agent review the project (code, CLAUDE.md, rules, skills) and drive the locally installed `agent-forge` to install or upgrade only the capabilities that fit, with the user approving every write.
version: 2.4.0
kind: skill
category: meta.agent-forge
purpose: Closes the gap between Agent Forge's manifest-based matching and a real review of the project. The agent decides what fits and why; Agent Forge stays the only writer (plans, hashes, rollback); the user stays the approver.
status: curated
provenance: workspace
source:
  source_id: workspace
license:
  spdx: MIT
  attribution: "Agent Forge maintainers"
  redistribution_ok: true
review:
  reviewed_at: "2026-10-21"
  reviewer: agent-forge maintainers
  rationale: >-
    Workspace-authored markdown only. Installed into a project by `agent-forge setup` (run by the one-line installer, ADR-0004) and otherwise opt-in (tag `agent-forge`). User-invoked (disable-model-invocation; Codex policy.allow_implicit_invocation false), so it costs no always-loaded context. It calls only `~/.agent-forge/bin/agent-forge`; allowed-tools pre-approves the read-only subcommands (incl. `lint`, `usage`, `decisions`) and `forge --dry-run`, so every write still needs the user's yes in the conversation and Claude Code's permission prompt. Version 2.1 assesses on the negative-first rubric of ADR-0007 and writes a decision record (`.agent-forge/decisions/<plan-id>.json`, the one file the skill writes) that `decisions verify` checks before `forge --decisions` uses it. Version 2.2 adds the review-coverage step: it looks for the project's reviewer subagents and decides per part (backend, client) between ADD / SKIP covered / ASK for forge.agent.backend-reviewer and forge.agent.frontend-reviewer. It forbids hand-editing agent files and reading the install directory.
  notes:
    - "Context budget of the skill itself: 14,160 characters of SKILL.md loaded on demand (2.0.1 was 6,519; 2.1.0 13,019); 0 always-loaded because it is user-invoked. tests/unit/test_entry_skill_budget.py keeps it at 0 always-on and under 16,000 on demand."
  acknowledged_findings:
    - rule: pipe-to-shell
      path: "*/agent-forge-upgrade/SKILL.md"
      reason: "The skill shows the user Agent Forge's own installer command to run themselves when it is missing; the agent is told to stop, not to run it."
applicability:
  tags: [agent-forge, meta, upgrade, review]
platforms: [claude_code, codex, copilot, gemini]
install_strategy: file_copy
destinations:
  - platform: claude_code
    source: claude_code/agent-forge-upgrade
    dest: .claude/skills/agent-forge-upgrade
    merge: create_only
  - platform: codex
    source: codex/agent-forge-upgrade
    dest: .agents/skills/agent-forge-upgrade
    merge: create_only
  - platform: copilot
    source: claude_code/agent-forge-upgrade
    dest: .github/skills/agent-forge-upgrade
    merge: create_only
  - platform: gemini
    source: claude_code/agent-forge-upgrade
    dest: .gemini/skills/agent-forge-upgrade
    merge: create_only
equivalents:
  - kind: skill
    name_patterns: ["^agent-forge"]
    description: an existing Agent Forge skill
validation:
  - type: frontmatter
    path: .claude/skills/agent-forge-upgrade/SKILL.md
    params: { required: [name, description] }
risk: low
benefit_score: 6
maintenance_cost: 1
