schema_version: "1"
id: forge.skill.agent-forge-upgrade
name: Agent Forge upgrade skill
description: The project's entry point to Agent Forge - user-invoked /agent-forge-upgrade has the coding agent review the project (code, CLAUDE.md, rules, skills) and drive the locally installed `agent-forge` to install or upgrade only the capabilities that fit, with the user approving every write.
version: 2.0.1
kind: skill
category: meta.agent-forge
purpose: Closes the gap between Agent Forge's manifest-based matching and a real review of the project. The agent decides what fits and why; Agent Forge stays the only writer (plans, hashes, rollback); the user stays the approver.
status: curated
provenance: workspace
source:
  source_id: workspace
license:
  spdx: MIT
  attribution: "Agent Forge maintainers"
  redistribution_ok: true
review:
  reviewed_at: "2026-10-20"
  reviewer: agent-forge maintainers
  rationale: Workspace-authored markdown only. Installed into a project by `agent-forge setup` (run by the one-line installer, ADR-0004) and otherwise opt-in (tag `agent-forge`). User-invoked (disable-model-invocation; Codex policy.allow_implicit_invocation false), so it costs no always-loaded context. It calls only `~/.agent-forge/bin/agent-forge`; allowed-tools pre-approves the read-only subcommands and `forge --dry-run`, so every write still needs the user's yes in the conversation and Claude Code's permission prompt. It forbids hand-editing agent files and reading the install directory.
  acknowledged_findings:
    - rule: pipe-to-shell
      path: "*/agent-forge-upgrade/SKILL.md"
      reason: "The skill shows the user Agent Forge's own installer command to run themselves when it is missing; the agent is told to stop, not to run it."
applicability:
  tags: [agent-forge, meta, upgrade, review]
platforms: [claude_code, codex, copilot, gemini]
install_strategy: file_copy
destinations:
  - platform: claude_code
    source: claude_code/agent-forge-upgrade
    dest: .claude/skills/agent-forge-upgrade
    merge: create_only
  - platform: codex
    source: codex/agent-forge-upgrade
    dest: .agents/skills/agent-forge-upgrade
    merge: create_only
  - platform: copilot
    source: claude_code/agent-forge-upgrade
    dest: .github/skills/agent-forge-upgrade
    merge: create_only
  - platform: gemini
    source: claude_code/agent-forge-upgrade
    dest: .gemini/skills/agent-forge-upgrade
    merge: create_only
equivalents:
  - kind: skill
    name_patterns: ["^agent-forge"]
    description: an existing Agent Forge skill
validation:
  - type: frontmatter
    path: .claude/skills/agent-forge-upgrade/SKILL.md
    params: { required: [name, description] }
risk: low
benefit_score: 6
maintenance_cost: 1
integrity:
  assets_sha256: 1488e953d4ba97697388701b10f3e57a9e9c36ec30ad42c02590aa725462a77b
  pinned_at: "2026-10-20"
