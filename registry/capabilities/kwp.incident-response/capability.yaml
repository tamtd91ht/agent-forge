review:
  reviewed_at: "2026-10-25"
  reviewer: agent-forge curation (automated session; human sign-off pending)
  rationale: >-
    165 lines of markdown (5.8 KB), user- or model-invoked ("we have an incident", "production is down", "write the postmortem"). One adaptation, applied by scripts/curate.py and declared in a footer as Apache-2.0 section 4(b) requires - the pointer to the plugin's CONNECTORS.md (not installed, so a dangling link) is replaced by one line explaining `~~category` placeholders. Names no other skill, ships no scripts. Tag-only until an evaluation shows it belongs in the default set of service projects (ADR-0008).
  notes:
    - "The connector sections suggest paging on-call or posting to an incident channel when those MCP tools are connected; whether the agent asks first depends on the user's permission settings."
