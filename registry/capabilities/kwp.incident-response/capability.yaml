schema_version: "1"
id: kwp.incident-response
name: Incident response (Knowledge Work Plugins)
description: Run a production incident from triage to blameless postmortem - SEV1-4 classification with response times, roles, status updates at a fixed cadence, a timeline, 5 whys and owned action items - using whatever monitoring, paging and chat tools are connected.
version: 1.0.0
kind: skill
category: engineering.operations
purpose: Gives a service team one shared shape for incidents (severity table, status-update and postmortem templates) so an outage is communicated and learned from the same way every time; the registry had no incident or postmortem content.
