schema_version: '1'
id: ecc.rules.arkts
name: ArkTS / HarmonyOS rules (path-scoped)
description: 'Path-scoped Claude Code rules for ArkTS / HarmonyOS: coding-style, patterns, security, testing. Each file carries `paths:` frontmatter, so it loads only when a matching file is in play and adds no always-loaded context.'
version: 1.0.0
kind: rule
category: engineering.standards
purpose: 'Gives a ArkTS / HarmonyOS project the stack-specific half of ECC''s rules without paying for it in every session: 20,120 characters of guidance that the tool attaches only to matching files.'
status: curated
provenance: adapted
