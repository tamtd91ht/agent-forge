  rationale: 53 lines of markdown (3.5 KB), verbatim from tag v5.3.2, model-invoked; declares MIT in its own frontmatter. Names no other skill and ships no scripts. Upstream injects it through SessionStart / SubagentStart hooks that write under ~/.claude; here it is an ordinary project skill, so the lite / full / ultra levels work as skill arguments for one invocation instead of a persisted mode - the only lines that assume the hook runtime. Tag-only, not always-on, until the project's own evaluation confirms the upstream numbers (source-curation rule). Overlaps karpathy.principles on "simplicity first" but is operational (ladder, test reflex, shortcut marker), so no conflict is declared.
