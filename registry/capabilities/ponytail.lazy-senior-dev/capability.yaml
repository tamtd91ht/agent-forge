schema_version: "1"
id: ponytail.lazy-senior-dev
name: Lazy senior dev mode (Ponytail)
description: The smallest change that fully solves the task - read the code the change touches first, then take the first rung that holds (does it need to exist, already in this codebase, standard library or platform, installed dependency, one readable line, the minimum that works), leave one small test where the logic needs it, mark deliberate limits with a `shortcut:` comment, and end the reply with what was skipped and the risks.
version: 1.0.0
kind: skill
category: engineering.behavior
purpose: Counters over-building (a hand-rolled calendar where the repo's Input with type=date would do), unrequested abstractions and a dependency for a few lines, while keeping the change complete (callers, tests, fixtures) and never cutting validation at trust boundaries, data-loss handling, security or accessibility. Upstream's paired benchmark (39 tasks x 5 runs, headless Claude Code, Opus 5.5) measured 53% fewer lines and 98% of risky logic shipped with a test against 68% for the same agent without the skill.
