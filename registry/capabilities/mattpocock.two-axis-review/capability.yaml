schema_version: "1"
id: mattpocock.two-axis-review
name: Two-axis review (standards and spec)
description: Review the diff since a fixed point on two separate axes run as parallel sub-agents - Standards (documented rules plus a Fowler smell baseline) and Spec (does it implement the originating issue/spec).
version: 1.0.0
kind: skill
category: engineering.review
purpose: Stops one kind of finding from masking the other - code can follow every standard and implement the wrong thing, or do exactly what was asked while breaking conventions. Repo standards override the smell baseline, and smells are always judgement calls.
status: curated
provenance: adapted
