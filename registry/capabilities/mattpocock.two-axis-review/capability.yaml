  rationale: Adapted from upstream code-review (89 lines). Renamed to two-axis-review because `code-review` collides with harness built-ins (Claude Code ships one). The precondition to run setup-matt-pocock-skills (not curated - writes CLAUDE.md outside markers, creates tracker labels) is replaced by the project's own issue-tracker docs; the agent uses git and, if present, gh/glab. Attribution footer added.
