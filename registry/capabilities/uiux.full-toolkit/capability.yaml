runtime_requirements:
  - name: node
    description: Node.js 18+ to run the installer
  - name: ui-ux-pro-max-cli
    description: "upstream installer; writes .claude/skills/ui-ux-pro-max (or .agents/skills for Codex) with data and Python scripts"
    install_hint: "npx ui-ux-pro-max-cli init --ai claude   (or --ai codex); review the dry-run first: --dry-run"
  - name: python3
    description: "stdlib-only Python used by the skill's search.py at runtime"
