schema_version: "1"
id: uiux.full-toolkit
name: UI UX Pro Max full toolkit
description: The complete UI UX Pro Max skill set (7 skills, Python search over design-system/palette/typography data, design-system generator), installed by its own CLI.
version: 2.15.0
kind: skill
category: design.ui
purpose: Full design-intelligence toolkit for frontend work. Agent Forge does not install it because it requires running an npm installer that copies ~3 MB of data and Python scripts into the project; use the upstream CLI after review.
status: curated
provenance: upstream
source:
