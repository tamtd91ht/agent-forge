review:
  reviewed_at: "2026-10-19"
  reviewer: agent-forge curation (automated session; human sign-off pending)
  rationale: Upstream CLAUDE.md is 65 lines of plain markdown with no commands, links to run, or tool assumptions. Adapted to live inside a shared file - title and "merge with project instructions" preamble replaced by a precedence line, headings demoted one level, a few bullets merged, attribution line added. Wording of the principles is unchanged. Upstream ships no LICENSE file; MIT is declared in README.md and SKILL.md frontmatter.
applicability:
