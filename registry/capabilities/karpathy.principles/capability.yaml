schema_version: "1"
id: karpathy.principles
name: Coding behavior principles (Karpathy)
description: Always-on section in CLAUDE.md / AGENTS.md with four principles against common LLM coding mistakes — think before coding, simplicity first, surgical changes, goal-driven execution.
version: 1.0.0
kind: instruction
category: engineering.behavior
purpose: Counters silent assumptions, overengineering, drive-by edits and unverified "done" in every session, not only when a skill happens to trigger. Kept short (~45 lines) so it is cheap in context and well under Codex's 32 KiB AGENTS.md budget.
status: curated
provenance: adapted
