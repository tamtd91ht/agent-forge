schema_version: "1"
id: forge.skill.money-safety
name: Money safety (balance changes that never double-apply)
description: Checklist for code that moves or records money - integer minor units, idempotency key checked before the state change, one atomic transaction or a saga with compensation and stored state, serialised operations per account under a lock, balance validated inside the transaction, bounded classified retries, immutable audit entries, outbox and idempotent consumers for money events, and the tests that prove each property.
version: 1.0.0
kind: skill
category: engineering.correctness
purpose: Stops the three ways money code fails in production - an operation applied twice, two operations racing on one account, a multi-step flow stopping half-way - by making the agent answer four design questions first and put idempotency, locking, atomicity and audit on every balance change.
status: curated
provenance: workspace
source:
  source_id: workspace
license:
  spdx: MIT
  attribution: "Agent Forge maintainers"
  redistribution_ok: true
review:
  reviewed_at: "2026-10-22"
  reviewer: agent-forge maintainers
  rationale: Workspace-authored, generalised from a production SaaS platform's critical money rule and its storage-specific companions (ADR-0010); product identifiers, storage engine and broker names were removed, what remains applies to any service that changes a balance. Pure markdown, one file, no scripts, hooks or MCP. Gated by the `money` trait, so it is proposed only to a project whose source shows money handling (wallet, ledger, invoice, refund, payout, minor units) or whose team confirmed the trait; on-demand, 0 always-loaded beyond name + description.
  notes:
    - "Trait-gated (ADR-0010). Complements forge.agent.backend-reviewer's 'money and transactions' review dimension with the implementation checklist."
    - "Evidence: in daily use in one production codebase; not measured by the harness (review.evidence empty on purpose)."
