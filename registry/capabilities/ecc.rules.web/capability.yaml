schema_version: '1'
id: ecc.rules.web
name: Web (CSS / HTML / components) rules (path-scoped)
description: 'Path-scoped Claude Code rules for Web (CSS / HTML / components): coding-style, patterns, security, testing, design-quality, performance. Each file carries `paths:` frontmatter, so it loads only when a matching file is in play and adds no always-loaded context.'
version: 1.0.0
kind: rule
category: engineering.standards
purpose: 'Gives a Web (CSS / HTML / components) project the stack-specific half of ECC''s rules without paying for it in every session: 12,456 characters of guidance that the tool attaches only to matching files.'
