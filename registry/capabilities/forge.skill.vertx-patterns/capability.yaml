schema_version: "1"
id: forge.skill.vertx-patterns
name: Vert.x patterns (nothing blocks the loop, every call has a timeout)
description: Checklist for any Vert.x verticle, handler, route, event-bus consumer, outbound call or test in Java or Kotlin - nothing blocks the event loop and blocking work runs in executeBlocking or a named worker pool with the blocked-thread checker on, Futures composed with a failure handler at the end and never result() or join(), a timeout on every outbound call and request/reply with bounded sized pools, state on the verticle's own context and sharing through the event bus with codecs and named addresses, explicit deployment options and server limits, shutdown that closes in reverse order inside stop(Promise), and vertx-junit5 tests with checkpoints and timeouts.
version: 1.0.0
kind: skill
category: engineering.reliability
purpose: Prevents the Vert.x failures that only show under load - an event loop stalled by a JDBC call or a join(), a Future chain whose failure is never handled, an outbound call with no timeout that leaks a connection per request, state shared between verticle instances through a static map, a stop() that returns before its resources close - by making the agent apply the toolkit's one rule and its consequences on every change.
