  rationale: >-
    Workspace-authored after a field test on a JVM platform that mixes Spring Boot and Vert.x
    services; the catalog served Spring and the scanner did not record Vert.x at all, so the
    reactive services received only generic guidance. Toolkit rules only (event loop, Futures,
    timeouts, context affinity, deployment, vertx-junit5); no product identifiers, verticle
    names, addresses or module layouts. Gated by the `vertx` framework the scanner records from
    an `io.vertx` build dependency (Maven or Gradle); on-demand, 0 always-loaded beyond name +
    description.
  notes:
    - "Complements ecc.java-coding-standards / ecc.rules.java (language) and the stack-neutral forge.agent.backend-reviewer; a Spring Boot module in the same repository keeps its springboot-* skills, this one speaks only about the Vert.x parts."
