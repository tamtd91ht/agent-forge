schema_version: "1"
id: forge.skill.event-consumer-safety
name: Event consumer safety (nothing lost, doubled or stuck)
description: Checklist for any consumer, listener or worker reading from a broker - acknowledge only after the work's own commit, deduplicate by message or operation id, classify failures into retryable and not, bound retries with backoff, dead-letter queue with context headers that is monitored and owned, ordering per business key with instances bounded by partitions, explicit group names and subscriptions, commit-then-close shutdown, lag alerts; broker-neutral (Kafka, RabbitMQ, SQS, Celery).
version: 1.0.0
kind: skill
category: engineering.correctness
purpose: Prevents the four standard consumer failures - a message lost by acknowledging too early, work done twice on redelivery, a queue stuck behind one poison message retried forever, and offsets replayed after a careless shutdown - by making the agent apply the same discipline whatever the broker's knob names are.
status: curated
provenance: workspace
source:
  source_id: workspace
license:
