  attribution: "Agent Forge maintainers"
  redistribution_ok: true
review:
  reviewed_at: "2026-10-22"
  reviewer: agent-forge maintainers
  rationale: >-
    Workspace-authored, generalised from a production platform's Kafka and RabbitMQ consumer
    rules (consumer safety, retry and DLQ tiers, graceful shutdown; ADR-0010). Product-specific
    constants modules, header names, alert thresholds and the Java code templates were removed;
    the broker-neutral rules and the per-broker knob names remain. Pure markdown, one file.
    Gated by the `event_driven` trait, which the scanner sets from a detected Kafka, RabbitMQ
    or Celery dependency; on-demand, 0 always-loaded beyond name + description.
  notes:
    - "Trait-gated (ADR-0010). The companion forge.skill.event-contract covers the producing side and topology; the two are deliberately split so the model loads only the half it needs."
    - "Evidence: in daily use in one production codebase; not measured by the harness (review.evidence empty on purpose)."
