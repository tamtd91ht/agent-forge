schema_version: "1"
id: ponytail.review
name: Paged-senior review (Ponytail)
description: Review a change in a fixed order of importance - correct, safe, holds under the expected load, tested, fast, lean - reading the callers and tests the diff touches, not only the diff. Every finding needs a concrete failing case and is written in plain English as what this is, problem, fix, if we skip it, grouped must fix / should fix / nice to have, with a verdict and what was not checked.
version: 1.0.0
kind: skill
category: engineering.review
purpose: Gives a review that a reader who has never seen the code can act on, and that catches what a diff-only review misses (a renamed field crashing an untouched caller, a fix applied in one caller while the shared function stays broken). A `shortcut:` comment that names its limit is treated as a decision, not a finding, so it pairs with the lazy-senior-dev ruleset without requiring it.
