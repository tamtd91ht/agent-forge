  rationale: 101 lines of markdown (5.2 KB), verbatim from tag v5.3.2, model-invoked ("review this", "review my PR"). Names no other skill, ships no scripts, changes no code. Upstream's benchmark reports 100% of planted problems found and 100% of problems outside the diff, against 87% and 78% without the skill. Complements mattpocock.two-axis-review (standards vs spec) and the forge reviewer agents (fixed backend / frontend dimensions); declared equivalent to any existing generic review skill so the planner proposes one, not three.
