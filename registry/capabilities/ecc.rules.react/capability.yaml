schema_version: '1'
id: ecc.rules.react
name: React rules (path-scoped)
description: 'Path-scoped Claude Code rules for React: coding-style, patterns, security, testing. Each file carries `paths:` frontmatter, so it loads only when a matching file is in play and adds no always-loaded context.'
version: 1.0.0
kind: rule
category: engineering.standards
purpose: 'Gives a React project the stack-specific half of ECC''s rules without paying for it in every session: 25,128 characters of guidance that the tool attaches only to matching files.'
status: curated
provenance: adapted
source:
  source_id: ecc
  repository: https://github.com/affaan-m/ECC
  revision: 76aaa77df6adc5b889e689007bf99b9a4f74af34
  paths:
  - rules/react/coding-style.md
  - rules/react/patterns.md
  - rules/react/security.md
  - rules/react/testing.md
license:
  spdx: MIT
  attribution: Everything Claude Code (ECC), Copyright (c) 2026 Affaan Mustafa
  redistribution_ok: true
  notice_file: claude_code/ecc-react/LICENSE-ECC.txt
review:
  reviewed_at: '2026-10-21'
  reviewer: agent-forge curation (automated session; human sign-off pending)
  rationale: Upstream rules/react/ minus hooks.md (it documents ECC's own hooks in ~/.claude/settings.json). Every file has `paths:` frontmatter, so context_chars is 0 (ADR-0003), which is why the per-language packs deferred in docs/rejections/ecc-rules-per-language.md are curated now. Installed under .claude/rules/ecc-react/ next to ecc-common/. Applies to frameworks react, nextjs, remix; no hard dependency on ecc.rules.common, the text stands on its own.
  notes:
  - 'Adapted: the ''> This file extends [common/x.md](../common/x.md)'' line in each file is rewritten to name ecc.rules.common instead of a relative link that would be broken once installed.'
applicability:
  frameworks:
  - react
  - nextjs
  - remix
  tags:
