schema_version: "1"
id: ponytail.shortcut-debt
name: Shortcut debt ledger (Ponytail)
description: List every `shortcut:` comment in the repo as a debt ledger - file and line, what was simplified, the ceiling it names, the trigger to revisit - and tag the ones with no trigger as the ones that silently rot. Read-only, one-shot; another marker word can be given as the argument.
version: 1.0.0
kind: skill
category: engineering.standards
purpose: Makes the deliberate simplifications of the lazy-senior-dev ruleset auditable - a `git grep` over the comment markers, one ledger row per hit with ceiling and upgrade trigger - so a deferral cannot quietly become permanent.
