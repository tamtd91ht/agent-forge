schema_version: "1"
id: forge.skill.view-data-loading
name: View data loading (request discipline for a screen)
description: Plan and review how a web or mobile view loads its data - request map (first paint vs enhancement vs on interaction), one request per resource, independent requests in parallel, nothing non-essential blocking the first render, fetch on need, dedupe / cache / cancel / ordering, per-stack pointers and a review checklist.
version: 1.0.0
kind: skill
category: engineering.performance
purpose: Stops the most common client-side performance bug - a screen that fires too many API calls, sequentially, and spins until every one of them has answered - by making the agent draw the request map first and keep secondary data off the critical path.
status: curated
provenance: workspace
source:
  source_id: workspace
license:
  spdx: MIT
  attribution: "Agent Forge maintainers"
  redistribution_ok: true
review:
  reviewed_at: "2026-10-21"
  reviewer: agent-forge maintainers
  rationale: Workspace-authored from a recurring finding in client projects (redundant and sequential API calls per view, secondary data blocking the main render). Pure markdown, one file, no scripts, hooks or MCP; framework pointers name only libraries the project may already use and tell the agent not to introduce a second one. Applies to every project the scanner marks frontend, fullstack or mobile-or-desktop, so /agent-forge-upgrade proposes it whenever a web or mobile part is detected; on-demand (model-invoked by its description), 0 always-loaded beyond name + description.
  notes:
    - "Complements ecc.react-performance (rendering, bundles) and ecc.frontend-patterns (architecture); this one is only about the request layer of a view and is stack-neutral."
