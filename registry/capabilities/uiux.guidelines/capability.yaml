review:
  reviewed_at: "2026-10-16"
  reviewer: agent-forge curation (automated session; human sign-off pending)
  rationale: The upstream SKILL.md hard-codes ${CLAUDE_PLUGIN_ROOT} paths and requires Python search scripts over 3 MB of CSV data; the two reference files are self-contained markdown. A workspace-authored SKILL.md wraps them with a priority table and points to the upstream CLI for the full toolkit. Only recommended for frontend / fullstack / mobile projects; design guidance is not evidence of implementation quality.
