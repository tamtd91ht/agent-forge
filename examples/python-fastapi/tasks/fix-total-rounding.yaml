id: fix-total-rounding
category: bugfix
prompt: 'app/billing.py has a bug: invoice_total() returns wrong results for some inputs (users report
  totals that are off by a cent). Find the bug, fix it, and add a regression test. Do not change the function
  signature.'
setup:
  files:
    app/billing.py: "\"\"\"Invoice totals in cents.\"\"\"\n\n\ndef invoice_total(lines: list[tuple[int,\
      \ int]], tax_rate_percent: int) -> int:\n    \"\"\"lines = [(unit_price_cents, quantity)]; returns\
      \ the total in cents including tax,\n    rounded half up to the nearest cent.\"\"\"\n    subtotal\
      \ = sum(price * qty for price, qty in lines)\n    tax = subtotal * tax_rate_percent / 100\n    return\
      \ int(subtotal + tax)\n"
acceptance:
  files:
    tests/test_billing_acceptance.py: "from app.billing import invoice_total\n\n\ndef test_rounds_half_up()\
      \ -> None:\n    assert invoice_total([(1, 1)], 50) == 2      # 1.5 -> 2\n    assert invoice_total([(333,\
      \ 1)], 7) == 356   # 356.31 -> 356\n    assert invoice_total([(5, 1)], 10) == 6      # 5.5 -> 6\n\
      \    assert invoice_total([(100, 3)], 0) == 300\n"
  command: python -m pytest -q tests/test_billing_acceptance.py
regression_command: python -m pytest -q
budget_seconds: 600
