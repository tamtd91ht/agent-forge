id: refactor-handlers-package
category: refactor
prompt: 'Move the HTTP handlers out of main.go into a package handlers/ (handlers.Health etc.) and build
  the router in a function newRouter() in main.go that uses them. Behaviour must not change: GET /health
  still returns {"ok": true}. Add a test for the router.'
acceptance:
  files:
    refactor_acceptance_test.go: "package main\n\nimport (\n\t\"net/http\"\n\t\"net/http/httptest\"\n\t\
      \"os\"\n\t\"strings\"\n\t\"testing\"\n)\n\nfunc TestHandlersPackageAndHealth(t *testing.T) {\n\t\
      if _, err := os.Stat(\"handlers\"); err != nil {\n\t\tt.Fatalf(\"handlers/ package missing: %v\"\
      , err)\n\t}\n\tw := httptest.NewRecorder()\n\treq, _ := http.NewRequest(http.MethodGet, \"/health\"\
      , nil)\n\tnewRouter().ServeHTTP(w, req)\n\tif w.Code != 200 || !strings.Contains(w.Body.String(),\
      \ `\"ok\":true`) {\n\t\tt.Fatalf(\"got %d %s\", w.Code, w.Body.String())\n\t}\n}\n"
  command: go test ./... -run TestHandlersPackageAndHealth
regression_command: go vet ./... && go test ./...
budget_seconds: 600
