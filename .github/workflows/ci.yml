name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install from the lock file (fails if uv.lock is out of date)
        run: uv sync --locked --all-extras
      - name: Lint
        run: |
          uv run ruff check src tests scripts tools
          uv run ruff format --check src tests scripts tools
      - name: Tests
        run: uv run python -m pytest -q
      - name: Registry
        # upstream checkouts are untrusted and not cloned in CI; provenance is checked locally
        run: uv run agent-forge validate --no-provenance
      - name: Schemas match the models
        run: uv run python scripts/export_schemas.py --check
      - name: Example projects match their reviewed expectations
        run: uv run python scripts/matching_report.py

  registry-integrity:
    # Independent of the test suite and run on every OS: the pinned digests must match the
    # bytes git ships (LF) *and* be computed the same way everywhere (0.3.1: Path ordering
    # differed between Windows and POSIX), or the installer rejects the entry skill.
    name: registry integrity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: No CRLF in the registry (index or working tree)
        shell: bash
        run: |
          bad="$(git ls-files --eol registry | grep -E 'i/crlf|w/crlf|i/mixed|w/mixed' || true)"
          if [ -n "$bad" ]; then echo "$bad"; echo "normalize to LF: git add --renormalize . && git checkout -- registry"; exit 1; fi
      - run: uv sync --locked --all-extras
      - name: Pinned digests match the assets
        run: uv run python scripts/pin_integrity.py --check
      - run: uv run agent-forge validate --no-provenance

  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install into a scratch project (POSIX)
        if: runner.os != 'Windows'
        env:
          AGENT_FORGE_SOURCE: ${{ github.workspace }}
          AGENT_FORGE_INSTALL_DIR: ${{ runner.temp }}/home/.agent-forge
        run: |
          mkdir -p "$RUNNER_TEMP/demo" && cd "$RUNNER_TEMP/demo"
          printf '[project]\nname="demo"\nversion="0"\n' > pyproject.toml
          sh "$GITHUB_WORKSPACE/install.sh"
          test -f .claude/skills/agent-forge-upgrade/SKILL.md
          "$AGENT_FORGE_INSTALL_DIR/bin/agent-forge" forge --dry-run . --json > /dev/null
          "$AGENT_FORGE_INSTALL_DIR/bin/agent-forge" check . --json > /dev/null
          # the installed catalog must pass the same integrity checks as the repository
          "$AGENT_FORGE_INSTALL_DIR/bin/agent-forge" validate --no-provenance
          "$AGENT_FORGE_INSTALL_DIR/bin/agent-forge" doctor --json > /dev/null
          grep -q '^verified=' "$AGENT_FORGE_INSTALL_DIR/VERSION"
          # self-update through the launcher (exit 16 handshake): the launcher runs the
          # installer (this checkout, via AGENT_FORGE_INSTALLER) and re-runs the command
          AGENT_FORGE_INSTALLER="$GITHUB_WORKSPACE/install.sh" "$AGENT_FORGE_INSTALL_DIR/bin/agent-forge" self-update --release v0.0.1 --json | grep -q '"installed": "source"'
          test ! -e "$AGENT_FORGE_INSTALL_DIR/UPDATE_TO"
          grep -q 'launcher v2' "$AGENT_FORGE_INSTALL_DIR/bin/agent-forge"
      - name: A release that cannot be verified is never installed (POSIX)
        if: runner.os != 'Windows'
        env:
          AGENT_FORGE_VERSION: v0.0.0
          AGENT_FORGE_INSTALL_DIR: ${{ runner.temp }}/home-none/.agent-forge
        run: |
          mkdir -p "$RUNNER_TEMP/demo-none" && cd "$RUNNER_TEMP/demo-none"
          if sh "$GITHUB_WORKSPACE/install.sh"; then echo "installer must fail"; exit 1; fi
          test ! -e "$AGENT_FORGE_INSTALL_DIR"
      - name: Install into a scratch project (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AGENT_FORGE_SOURCE: ${{ github.workspace }}
          AGENT_FORGE_INSTALL_DIR: ${{ runner.temp }}\home\.agent-forge
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\demo" | Out-Null
          Set-Location "$env:RUNNER_TEMP\demo"
          Set-Content pyproject.toml "[project]`nname='demo'`nversion='0'"
          Get-Content "$env:GITHUB_WORKSPACE\install.ps1" -Raw | Invoke-Expression
          if (-not (Test-Path .claude\skills\agent-forge-upgrade\SKILL.md)) { throw "entry skill missing" }
          & "$env:AGENT_FORGE_INSTALL_DIR\bin\agent-forge.cmd" forge --dry-run . --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "dry-run failed" }
          & "$env:AGENT_FORGE_INSTALL_DIR\bin\agent-forge.cmd" check . --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "check failed" }
          & "$env:AGENT_FORGE_INSTALL_DIR\bin\agent-forge.cmd" validate --no-provenance
          if ($LASTEXITCODE -ne 0) { throw "installed catalog fails validate" }
          if (-not (Select-String -Path "$env:AGENT_FORGE_INSTALL_DIR\VERSION" -Pattern '^verified=' -Quiet)) { throw "VERSION file missing" }
          # self-update through the launcher (exit 16 handshake), installer = this checkout
          $env:AGENT_FORGE_INSTALLER = "$env:GITHUB_WORKSPACE\install.ps1"
          $out = & "$env:AGENT_FORGE_INSTALL_DIR\bin\agent-forge.cmd" self-update --release v0.0.1 --json
          if ($LASTEXITCODE -ne 0 -or -not ("$out" -match '"installed": "source"')) { throw "self-update through the launcher failed: $out" }
          if (Test-Path "$env:AGENT_FORGE_INSTALL_DIR\UPDATE_TO") { throw "UPDATE_TO not consumed" }
          if (-not (Select-String -Path "$env:AGENT_FORGE_INSTALL_DIR\bin\agent-forge.cmd" -Pattern 'launcher v2' -Quiet)) { throw "launcher rewritten" }
      - name: A release that cannot be verified is never installed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AGENT_FORGE_VERSION: v0.0.0
          AGENT_FORGE_INSTALL_DIR: ${{ runner.temp }}\home-none\.agent-forge
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\demo-none" | Out-Null
          Set-Location "$env:RUNNER_TEMP\demo-none"
          $failed = $false
          try { Get-Content "$env:GITHUB_WORKSPACE\install.ps1" -Raw | Invoke-Expression } catch { $failed = $true }
          if (-not $failed) { throw "installer must fail" }
          if (Test-Path $env:AGENT_FORGE_INSTALL_DIR) { throw "nothing may be installed" }

  audit:
    name: dependency audit (locked runtime set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Export the locked runtime requirements
        run: uv export --no-dev --no-emit-project --format requirements-txt -o requirements-locked.txt
      - name: Known vulnerabilities in the locked runtime dependencies
        # `uv pip install --system` fails on the runner's externally managed Python (0.3.1);
        # uvx runs pip-audit in its own environment instead.
        run: uvx pip-audit --strict --desc -r requirements-locked.txt
