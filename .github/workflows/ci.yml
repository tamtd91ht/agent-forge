name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Tests
        run: python -m pytest -q
      - name: Registry
        # upstream checkouts are untrusted and not cloned in CI; provenance is checked locally
        run: agent-forge validate --no-provenance
      - name: Schemas match the models
        run: python scripts/export_schemas.py --check
      - name: Example projects match their reviewed expectations
        run: python scripts/matching_report.py

  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install into a scratch project (POSIX)
        if: runner.os != 'Windows'
        env:
          AGENT_FORGE_SOURCE: ${{ github.workspace }}
          AGENT_FORGE_INSTALL_DIR: ${{ runner.temp }}/home/.agent-forge
        run: |
          mkdir -p "$RUNNER_TEMP/demo" && cd "$RUNNER_TEMP/demo"
          printf '[project]\nname="demo"\nversion="0"\n' > pyproject.toml
          sh "$GITHUB_WORKSPACE/install.sh"
          test -f .claude/skills/agent-forge-upgrade/SKILL.md
          "$AGENT_FORGE_INSTALL_DIR/bin/agent-forge" forge --dry-run . --json > /dev/null
      - name: Install into a scratch project (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AGENT_FORGE_SOURCE: ${{ github.workspace }}
          AGENT_FORGE_INSTALL_DIR: ${{ runner.temp }}\home\.agent-forge
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\demo" | Out-Null
          Set-Location "$env:RUNNER_TEMP\demo"
          Set-Content pyproject.toml "[project]`nname='demo'`nversion='0'"
          Get-Content "$env:GITHUB_WORKSPACE\install.ps1" -Raw | Invoke-Expression
          if (-not (Test-Path .claude\skills\agent-forge-upgrade\SKILL.md)) { throw "entry skill missing" }
          & "$env:AGENT_FORGE_INSTALL_DIR\bin\agent-forge.cmd" forge --dry-run . --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "dry-run failed" }

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - name: Known vulnerabilities in runtime dependencies
        run: pip-audit --strict --desc .
