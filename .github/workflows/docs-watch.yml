name: docs-watch

# Weekly: did the official documentation pages the adapters were verified against change?
# A change opens (or updates) one issue; a maintainer re-verifies the conventions, bumps
# `verified_on` in the adapter and runs `python scripts/watch_docs.py --update` in one PR.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Compare documentation pages with the stored digests
        id: watch
        run: |
          set +e
          uv run python scripts/watch_docs.py --check | tee watch.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Open or update the tracking issue
        if: steps.watch.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Adapter documentation changed upstream (docs-watch)"
          body="$(printf 'The weekly docs watch found changes on pages the adapters were verified against.\n\nRe-verify the conventions, bump `verified_on` in the adapter and run `python scripts/watch_docs.py --update` in the same PR.\n\n```\n%s\n```\n\nRun: %s/%s/actions/runs/%s\n' "$(cat watch.txt)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label maintenance
          fi
